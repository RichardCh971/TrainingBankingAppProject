name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safety check
        run: |
          pip install safety
          safety check --json

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit


  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: Run flake8
        run: flake8 customer_api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pylint
        run: pylint customer_api/ --exit-zero


  permissions-check:
    name: Permissions & Authorization Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded credentials
        run: |
          grep -r "password\|api_key\|secret\|token" customer_api/ --include="*.py" | grep -v "# " || echo "No obvious hardcoded credentials found"

      - name: Check for overly permissive file permissions
        run: |
          find customer_api/ -type f -perm 0777 -o -perm 0666 | wc -l || echo "No world-writable files detected"

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-quality]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "Security scan completed!"
          echo "Check artifacts and logs for detailed reports."
