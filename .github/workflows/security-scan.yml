name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  secret-scan:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --baseline customer_api/.secrets.baseline
          detect-secrets audit .secrets.baseline

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run safety check
        run: |
          pip install safety
          safety check --json

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Run Bandit
        run: |
          bandit -r customer_api/ -f json -o bandit-report.json || true
          bandit -r customer_api/ -f txt

      - name: Run Semgrep
        run: |
          semgrep --config=p/security-audit customer_api/ --json --output=semgrep-report.json || true
          semgrep --config=p/security-audit customer_api/

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: Run flake8
        run: flake8 customer_api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pylint
        run: pylint customer_api/ --exit-zero

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build -t restapi:latest . || echo "Dockerfile not found, skipping container scan"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
            image-ref: restapi:latest
            format: table
            exit-code: 1
            ignore-unfixed: true
            vuln-type: os,library
            severity: HIGH,CRITICAL

  permissions-check:
    name: Permissions & Authorization Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded credentials
        run: |
          grep -r "password\|api_key\|secret\|token" customer_api/ --include="*.py" | grep -v "# " || echo "No obvious hardcoded credentials found"

      - name: Check for overly permissive file permissions
        run: |
          find customer_api/ -type f -perm 0777 -o -perm 0666 | wc -l || echo "No world-writable files detected"

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, sast-scan, code-quality]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "Security scan completed!"
          echo "Check artifacts and logs for detailed reports."
